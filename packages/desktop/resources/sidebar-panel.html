<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sp-bg: #1a1a2e;
      --sp-bg-soft: #252540;
      --sp-bg-elevated: #2a2a4a;
      --sp-fg: #e5e5e5;
      --sp-fg-dim: #999;
      --sp-border: #333;
      --sp-accent: #6366f1;
      --sp-success: #22c55e;
      --sp-warning: #f59e0b;
      --sp-danger: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: var(--sp-fg);
      background: var(--sp-bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Tab Bar */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--sp-border);
      padding: 0 8px;
    }

    .tab {
      padding: 10px 16px;
      background: none;
      border: none;
      color: var(--sp-fg-dim);
      cursor: pointer;
      font-size: 13px;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .tab:hover { color: var(--sp-fg); }
    .tab.active {
      color: var(--sp-fg);
      border-bottom-color: var(--sp-accent);
    }

    /* Content Area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .empty, .loading, .error-msg {
      padding: 24px;
      text-align: center;
      color: var(--sp-fg-dim);
    }

    .error-msg { color: var(--sp-danger); }

    /* File Node */
    .node {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      cursor: pointer;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      transition: background 0.1s;
    }

    .node:hover { background: var(--sp-bg-soft); }
    .node.selected { background: var(--sp-bg-elevated); }

    .node-icon { width: 16px; text-align: center; flex-shrink: 0; }
    .node-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .node-size { color: var(--sp-fg-dim); font-size: 11px; }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      font-weight: 600;
    }

    /* Preview Panel */
    .preview {
      border-top: 1px solid var(--sp-border);
      max-height: 45%;
      display: flex;
      flex-direction: column;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--sp-bg-soft);
      font-size: 12px;
      border-bottom: 1px solid var(--sp-border);
    }

    .preview-path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .preview-close {
      background: none;
      border: none;
      color: var(--sp-fg-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      line-height: 1;
    }

    .preview-close:hover { color: var(--sp-fg); }

    .preview-content {
      flex: 1;
      overflow: auto;
      margin: 0;
      padding: 12px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Diff Highlighting */
    .diff-line { padding: 0 12px; }
    .diff-add { background: rgba(34, 197, 94, 0.15); color: var(--sp-success); }
    .diff-del { background: rgba(239, 68, 68, 0.15); color: var(--sp-danger); }
    .diff-hunk { color: var(--sp-accent); font-weight: 600; }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
      border-bottom: 1px solid var(--sp-border);
    }

    .toolbar-btn {
      padding: 4px 8px;
      background: var(--sp-bg-soft);
      border: 1px solid var(--sp-border);
      color: var(--sp-fg);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .toolbar-btn:hover { background: var(--sp-bg-elevated); }
    .toolbar-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .toolbar-search {
      flex: 1;
      padding: 4px 8px;
      background: var(--sp-bg);
      border: 1px solid var(--sp-border);
      color: var(--sp-fg);
      border-radius: 4px;
      font-size: 12px;
    }

    .toolbar-search::placeholder { color: var(--sp-fg-dim); }
  </style>
</head>
<body>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="files">📁 Files</button>
    <button class="tab" data-tab="changed">📝 Changes</button>
  </div>

  <div class="toolbar">
    <input type="text" class="toolbar-search" id="search" placeholder="Search files...">
    <button class="toolbar-btn" id="refresh">🔄 Refresh</button>
  </div>

  <div class="content" id="content">
    <div class="loading">Loading...</div>
  </div>

  <div class="preview" id="preview" style="display: none;">
    <div class="preview-header">
      <span class="preview-path" id="previewPath"></span>
      <button class="preview-close" id="previewClose">×</button>
    </div>
    <pre class="preview-content" id="previewContent">Loading...</pre>
  </div>

  <script>
    // State
    let activeTab = 'files';
    let files = [];
    let changedFiles = [];
    let selectedFile = null;
    let searchQuery = '';
    let workspacePath = '';

    // DOM Elements
    const tabsEl = document.getElementById('tabs');
    const contentEl = document.getElementById('content');
    const previewEl = document.getElementById('preview');
    const previewPathEl = document.getElementById('previewPath');
    const previewContentEl = document.getElementById('previewContent');
    const searchEl = document.getElementById('search');
    const refreshEl = document.getElementById('refresh');

    // Listen for workspace updates from main process
    if (window.electronAPI && window.electronAPI.sidebarControl) {
      // Subscribe to workspace updates
      const ipcRenderer = window.require?.('electron')?.ipcRenderer;
      if (ipcRenderer) {
        ipcRenderer.on('sidebar:update-workspace', (event, path) => {
          workspacePath = path;
          load();
        });
      }
    }

    // Tab switching
    tabsEl.addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;

      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.dataset.tab;
      load();
    });

    // Search
    searchEl.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      render();
    });

    // Refresh
    refreshEl.addEventListener('click', load);

    // Preview close
    document.getElementById('previewClose').addEventListener('click', () => {
      selectedFile = null;
      previewEl.style.display = 'none';
    });

    // Load data
    async function load() {
      contentEl.innerHTML = '<div class="loading">Loading...</div>';

      try {
        if (activeTab === 'files') {
          const result = await window.electronAPI.sidebar.listProducedFiles(workspacePath || '');
          files = result.success ? result.files : [];
        } else {
          const result = await window.electronAPI.sidebar.listChangedFiles(workspacePath || '');
          changedFiles = result.success ? result.files : [];
        }
      } catch (err) {
        contentEl.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
        return;
      }

      render();
    }

    // Render file list
    function render() {
      const items = activeTab === 'files' ? files : changedFiles;
      const filtered = items.filter(f => {
        const path = f.path || f.name;
        return path.toLowerCase().includes(searchQuery);
      });

      if (filtered.length === 0) {
        contentEl.innerHTML = '<div class="empty">No files found</div>';
        return;
      }

      let html = '';
      for (const file of filtered) {
        const path = file.path || file.name;
        const name = file.name || path.split('/').pop();
        const isDir = file.isDir !== false;
        const icon = isDir ? '📁' : '📄';
        const size = file.size ? formatSize(file.size) : '';

        let badge = '';
        if (file.status) {
          const color = file.status === 'added' ? 'var(--sp-success)' :
                       file.status === 'deleted' ? 'var(--sp-danger)' : 'var(--sp-warning)';
          badge = `<span class="badge" style="background: ${color}">${file.status[0].toUpperCase()}</span>`;
        }

        html += `
          <div class="node" data-path="${path}" data-isdir="${isDir}">
            <span class="node-icon">${icon}</span>
            <span class="node-name">${name}</span>
            ${badge}
            ${size ? `<span class="node-size">${size}</span>` : ''}
          </div>
        `;
      }

      contentEl.innerHTML = html;

      // Add click handlers
      contentEl.querySelectorAll('.node').forEach(el => {
        el.addEventListener('click', () => openFile(el.dataset.path, el.dataset.isdir === 'true'));
      });
    }

    // Open file
    async function openFile(path, isDir) {
      if (isDir) return;

      selectedFile = path;
      contentEl.querySelectorAll('.node').forEach(el => {
        el.classList.toggle('selected', el.dataset.path === path);
      });

      previewEl.style.display = 'flex';
      previewPathEl.textContent = path;
      previewContentEl.textContent = 'Loading...';

      try {
        if (activeTab === 'changed') {
          const result = await window.electronAPI.sidebar.getFileDiff(workspacePath || '', path);
          if (result.success) {
            renderDiff(result.diff);
          } else {
            previewContentEl.textContent = result.error || 'Failed to load diff';
          }
        } else {
          // For file preview, construct full path
          const fullPath = workspacePath ? workspacePath + '/' + path : path;
          const result = await window.electronAPI.sidebar.getFileContent(fullPath);
          if (result.success) {
            previewContentEl.textContent = result.content;
          } else {
            previewContentEl.textContent = result.error || 'Failed to load file';
          }
        }
      } catch (err) {
        previewContentEl.textContent = `Error: ${err.message}`;
      }
    }

    // Render diff
    function renderDiff(diff) {
      if (!diff) {
        previewContentEl.textContent = 'No diff available';
        return;
      }

      const lines = diff.split('\n');
      let html = '';
      for (const line of lines) {
        let className = 'diff-line';
        if (line.startsWith('+')) className += ' diff-add';
        else if (line.startsWith('-')) className += ' diff-del';
        else if (line.startsWith('@@')) className += ' diff-hunk';

        html += `<div class="${className}">${escapeHtml(line)}</div>`;
      }
      previewContentEl.innerHTML = html;
    }

    // Helpers
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial load
    load();
  </script>
</body>
</html>
