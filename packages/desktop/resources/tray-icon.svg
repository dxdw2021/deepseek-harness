<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE"/>
      <stop offset="50%" style="stop-color:#00F2FE"/>
      <stop offset="100%" style="stop-color:#43E97B"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA"/>
      <stop offset="100%" style="stop-color:#764BA2"/>
    </linearGradient>
  </defs>
  <!-- H 字母简化版 -->
  <g transform="translate(12, 8)">
    <!-- 左竖 -->
    <path d="M0 0 L0 48" fill="none" stroke="url(#mainGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- 右竖 -->
    <path d="M40 0 L40 48" fill="none" stroke="url(#mainGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- 横 -->
    <path d="M0 24 L40 24" fill="none" stroke="url(#highlightGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
